[project]
name = "design-data-manager"
version = "0.1.0"
description = "Catalog, validate and sync Revit parameters, families and schedules."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: builds the generated Revit macro with the .NET SDK (skipped without Revit 2025+)"]
