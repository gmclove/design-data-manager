[project]
name = "design-data-manager"
version = "0.1.0"
description = "Catalog, validate and sync Revit parameters, families and schedules."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
